<body class="flight-radar-body" data-demo-state="offline">
    <header class="flight-radar-header">
        <nav aria-label="Primary navigation">
            <a class="nav-name" href="../index.html">Ethan Mayer</a>
            <ul>
                <li><a href="../index.html">Home</a></li><li><a href="../about/">About</a></li>
                <li><a href="../resume/">Resume</a></li>
                <li><a href="../projects/">Projects</a></li>
                <li><a href="../games/">Games</a></li>
                <li><a href="../photos/">Photos</a></li>
                <li><a href="../blog/">Blog</a></li>
            </ul>
        </nav>
    </header>

    <main class="flight-radar-shell">
        <section class="radar-workspace" aria-labelledby="sector-heading">
            <div class="radar-board-panel">
                <header class="radar-panel-header">
                    <div>
                        <p class="panel-kicker">Live airspace / Iowa</p>
                        <h1 id="sector-heading">Iowa Skywatch</h1>
                    </div>
                    <div class="radar-panel-tools">
                        <div class="feed-status" id="feed-status" data-state="offline" role="status" aria-live="polite">
                            Fixture ready / checking live feed
                        </div>
                        <button class="radar-button" id="refresh-button" type="button">Refresh</button>
                    </div>
                </header>

                <div class="radar-board" id="radar-board">
                    <svg id="radar-map" viewBox="0 0 1000 640" role="img" aria-labelledby="map-title map-description">
                        <title id="map-title">Live aircraft over Iowa</title>
                        <desc id="map-description">A geographic map of Iowa with aircraft positions from the Airplanes.live ADS-B feed.</desc>
                        <defs>
                            <pattern id="radar-grid" width="56" height="56" patternUnits="userSpaceOnUse">
                                <path d="M 56 0 L 0 0 0 56" fill="none" stroke="#86a59e" stroke-width="1" opacity="0.28"></path>
                            </pattern>
                            <radialGradient id="radar-wash" cx="50%" cy="45%" r="72%">
                                <stop offset="0%" stop-color="#e5efea"></stop>
                                <stop offset="100%" stop-color="#cbded7"></stop>
                            </radialGradient>
                        </defs>
                        <rect class="map-surface" width="1000" height="640" fill="url(#radar-wash)"></rect>
                        <rect class="map-grid" width="1000" height="640" fill="url(#radar-grid)"></rect>
                        <path id="iowa-shape" class="iowa-shape" aria-hidden="true"></path>
                        <text id="iowa-label" class="iowa-label" aria-hidden="true">IOWA</text>
                        <g id="airport-layer" class="airport-layer" aria-hidden="true"></g>
                        <g id="aircraft-layer" class="aircraft-layer"></g>
                    </svg>
                    <div class="map-corner map-corner-top">ADS-B / MLAT</div>
                    <div class="map-corner map-corner-bottom">IOWA / STATE BOUNDS</div>
                    <p class="radar-map-hint" id="selected-status" role="status" aria-live="polite">Click an aircraft marker for details</p>
                </div>
            </div>
        </section>
    </main>

    <script src="../site-play.js?v=pet-companion-2"></script>
    <script src="app.js?v=1"></script>
</body>
</html>
