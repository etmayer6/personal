name: Refresh Iowa Skywatch snapshot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flight-radar-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch the latest Iowa snapshot
        run: node tools/update-flight-snapshot.cjs

      - name: Commit the snapshot when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flight-radar/live.json
          if git diff --cached --quiet; then
            echo "The snapshot did not change."
          else
            git commit -m "chore: refresh Iowa Skywatch snapshot"
            git push origin HEAD:main
          fi
