<head>
    <meta charset="UTF-8">

    <meta name="description" content="Play a browser-based Conway's Game of Life simulation. Paint cells, choose a seed, and watch the board evolve.">

    <link rel="stylesheet" href="style.css?v=1">

        <meta property="og:title" content="Conway's Game of Life | Ethan Mayer">
        <meta property="og:description" content="Play a browser-based Conway's Game of Life simulation. Paint cells, choose a seed, and watch the board evolve.">

<body class="life-body" data-demo-state="ready">
    <header class="life-header">
        <div class="life-header-inner">
            <a class="life-brand" href="../games/">&larr; Games</a>
            <h1 class="life-header-title">Conway&rsquo;s Game of Life</h1>
            <span class="life-header-status">Life lab</span>
        </div>
    </header>

    <main class="life-shell">
        <section class="life-game" aria-labelledby="board-title">
            <div class="life-game-heading">
                <div>
                    <p class="life-kicker">The simulation</p>
                    <h2 id="board-title">Seed the board.</h2>
                </div>
                <div class="life-status" id="life-status" role="status" aria-live="polite">Ready to evolve</div>
            </div>

            <div class="life-board-layout">
                <div class="life-board" id="life-board">
                    <canvas id="life-canvas" width="960" height="600" tabindex="0" aria-label="Game of Life board. Click a cell to place or erase it, then drag to continue."></canvas>
                    <div class="canvas-footer">
                        <span id="interaction-readout">Click a cell to paint or erase; drag to draw</span>
                        <span id="coordinate-readout">x 00 / y 00</span>
                    </div>
                </div>

                <aside class="life-controls" aria-label="Simulation controls">
                    <div class="control-cluster primary-controls">
                        <button class="control-button control-button-primary" id="run-button" type="button">Start simulation</button>
                        <button class="control-button" id="step-button" type="button">Next generation</button>
                    </div>

                    <div class="control-cluster">
                        <div class="control-label"><span>Generations</span><strong id="generation-value">0</strong></div>
                        <div class="control-label"><span>Living cells</span><strong id="population-value">5</strong></div>
                        <div class="control-label"><span>Board state</span><strong id="lifecycle-value">Glider seeded</strong></div>
                        <label class="speed-label" for="speed-input"><span>Simulation speed</span><output id="speed-value" for="speed-input">8 gen/s</output></label>
                        <input id="speed-input" type="range" min="1" max="20" value="8">
                    </div>

                    <div class="control-cluster">
                        <p class="control-heading">Start with a pattern</p>
                        <div class="pattern-list" id="pattern-list">
                            <button type="button" data-pattern="glider">Glider</button>
                            <button type="button" data-pattern="blinker">Blinker</button>
                            <button type="button" data-pattern="beacon">Beacon</button>
                            <button type="button" data-pattern="toad">Toad</button>
                            <button type="button" data-pattern="pulsar">Pulsar</button>
                            <button type="button" data-pattern="r-pentomino">R-pentomino</button>
                            <button type="button" data-pattern="spaceship">Spaceship</button>
                            <button type="button" data-pattern="random">Random soup</button>
                        </div>
                    </div>

                    <div class="control-cluster utility-controls">
                        <button class="control-button" id="randomize-button" type="button">Randomize board</button>
                        <button class="control-button" id="clear-button" type="button">Clear board</button>
                        <button class="control-button" id="fullscreen-button" type="button">Fullscreen <span aria-hidden="true">F</span></button>
                    </div>
                </aside>
            </div>

        </section>

    </main>

    <script src="app.js?v=1"></script>
</body>
</html>
