<body class="photos-body">
    <header class="photos-header">
        <nav aria-label="Primary navigation">
            <a class="nav-name" href="../index.html">Ethan Mayer</a>
            <ul>
                <li><a href="../index.html">Home</a></li><li><a href="../about/">About</a></li>
                <li><a href="../resume/">Resume</a></li>
                <li><a href="../projects/">Projects</a></li>
                <li><a href="../games/">Games</a></li>
                <li><a aria-current="page" href="../photos/">Photos</a></li>
                <li><a href="../blog/">Blog</a></li>
            </ul>
        </nav>
    </header>

    <main class="photos-shell">
        <section class="photos-toolbar" aria-label="Gallery controls">
            <div class="view-control" role="group" aria-label="Photo order">
                <button class="view-button is-active" type="button" data-gallery-mode="journal" aria-pressed="true">Curated journal</button>
                <button class="view-button" type="button" data-gallery-mode="archive" aria-pressed="false">Full archive</button>
                <button class="view-button" type="button" data-gallery-mode="shuffle" aria-pressed="false">Shuffle all</button>
            </div>
            <p id="photos-status" aria-live="polite">27 selected photographs across four chapters.</p>
        </section>
        <div id="photos-gallery" class="photos-gallery"></div>
        <section id="photos-empty" class="photos-empty" hidden>
            <p>No photos to show yet.</p>
        </section>
    </main>

    <dialog id="photo-viewer" class="photo-viewer" aria-labelledby="photo-viewer-title">
        <div class="photo-viewer-shell">
            <header class="photo-viewer-header">
                <p><span id="photo-viewer-position">01 / 01</span><span>Fullscreen slideshow</span></p>
                <div>
                    <span class="photo-viewer-hint"><kbd>&larr;</kbd><kbd>&rarr;</kbd> Navigate</span>
                    <button id="photo-viewer-close" class="photo-viewer-close" type="button">Close <span aria-hidden="true">&times;</span></button>
                </div>
            </header>
            <div id="photo-viewer-stage" class="photo-viewer-stage">
                <button id="photo-viewer-previous" class="photo-viewer-nav photo-viewer-nav--previous" type="button" aria-label="Previous photo">
                    <span aria-hidden="true">&larr;</span>
                </button>
                <div class="photo-viewer-image-wrap">
                    <img id="photo-viewer-image" src="" alt="" width="1440" height="1080">
                </div>
                <button id="photo-viewer-next" class="photo-viewer-nav photo-viewer-nav--next" type="button" aria-label="Next photo">
                    <span aria-hidden="true">&rarr;</span>
                </button>
            </div>
            <footer class="photo-viewer-caption">
                <h2 id="photo-viewer-title">Photograph</h2>
            </footer>
        </div>
    </dialog>

    <footer class="photos-footer">
        <p>&copy; 2026 Ethan Mayer</p>
    </footer>

    <script src="image-manifest.js?v=dimensions-1"></script>

</body>
</html>
