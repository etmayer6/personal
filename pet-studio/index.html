<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a custom pet companion that follows you around Ethan Mayer's personal site.">
    <title>Pet Studio | Ethan Mayer</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../pet-companion.css?v=2">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body class="pet-studio-body" data-demo-state="draft">
    <header class="pet-studio-header">
        <div class="pet-studio-header-inner">
            <a class="pet-studio-brand" href="../projects/">&larr; Projects</a>
            <h1 id="pet-studio-title" class="pet-studio-header-title">Pet Studio</h1>
            <span class="pet-studio-header-status">Companion lab</span>
        </div>
    </header>

    <main class="pet-studio-shell">
        <section class="pet-studio-layout" aria-label="Custom pet creator">
            <div class="pet-preview-panel">
                <div class="pet-panel-top">
                    <div>
                        <span class="pet-panel-kicker">Pet studio</span>
                        <span class="pet-panel-status"><i aria-hidden="true"></i><span id="pet-preview-status">Draft companion</span></span>
                    </div>
                    <span id="pet-preview-species">CAT</span>
                </div>
                <div class="pet-preview-stage">
                    <div class="pet-preview-sky" aria-hidden="true"></div>
                    <div id="pet-preview-art" class="pet-preview-art" aria-label="Custom pet preview"></div>
                    <div class="pet-preview-shadow" aria-hidden="true"></div>
                    <span class="pet-preview-spark spark-one" aria-hidden="true">+</span>
                    <span class="pet-preview-spark spark-two" aria-hidden="true">+</span>
                </div>
                <div class="pet-preview-caption">
                    <div>
                        <span class="pet-caption-label">Your companion</span>
                        <h2 id="pet-preview-name">Unnamed friend</h2>
                    </div>
                    <span id="pet-preview-trait">Ready to roam</span>
                </div>
            </div>

            <form class="pet-builder-card" id="pet-form">
                <div class="builder-heading">
                    <p class="eyebrow">Companion lab</p>
                    <h2>Make a pet to explore with.</h2>
                </div>

                <label class="builder-label" for="pet-name">Name
                    <input id="pet-name" name="pet-name" type="text" maxlength="18" autocomplete="off" placeholder="Mochi" required>
                </label>

                <fieldset class="builder-fieldset">
                    <legend>Creature type</legend>
                    <div class="builder-choice-grid">
                        <button type="button" class="builder-choice" data-species="cat" aria-label="Cat, curious" aria-pressed="true">
                            <span class="builder-choice-art" aria-hidden="true"></span>
                            <span class="builder-choice-copy"><strong>Cat</strong><small>curious</small></span>
                        </button>
                        <button type="button" class="builder-choice" data-species="dog" aria-label="Dog, loyal" aria-pressed="false">
                            <span class="builder-choice-art" aria-hidden="true"></span>
                            <span class="builder-choice-copy"><strong>Dog</strong><small>loyal</small></span>
                        </button>
                        <button type="button" class="builder-choice" data-species="fox" aria-label="Fox, clever" aria-pressed="false">
                            <span class="builder-choice-art" aria-hidden="true"></span>
                            <span class="builder-choice-copy"><strong>Fox</strong><small>clever</small></span>
                        </button>
                        <button type="button" class="builder-choice" data-species="dragon" aria-label="Dragon, mighty" aria-pressed="false">
                            <span class="builder-choice-art" aria-hidden="true"></span>
                            <span class="builder-choice-copy"><strong>Dragon</strong><small>mighty</small></span>
                        </button>
                    </div>
                </fieldset>

                <div class="builder-color-row">
                    <label class="builder-label" for="pet-color">Body color
                        <input id="pet-color" type="color" value="#f2cb3f" aria-label="Pet body color">
                    </label>
                    <label class="builder-label" for="pet-accent">Markings
                        <input id="pet-accent" type="color" value="#e77952" aria-label="Pet markings color">
                    </label>
                </div>

                <fieldset class="builder-fieldset">
                    <legend>Accessory</legend>
                    <div class="builder-choice-grid builder-accessory-grid">
                        <button type="button" class="builder-choice" data-accessory="none" aria-label="None, clean" aria-pressed="true">
                            <span class="accessory-icon accessory-icon-none" aria-hidden="true"></span>
                            <span class="builder-choice-copy"><strong>None</strong><small>clean</small></span>
                        </button>
                        <button type="button" class="builder-choice" data-accessory="scarf" aria-label="Scarf, cozy" aria-pressed="false">
                            <span class="accessory-icon accessory-icon-scarf" aria-hidden="true"></span>
                            <span class="builder-choice-copy"><strong>Scarf</strong><small>cozy</small></span>
                        </button>
                        <button type="button" class="builder-choice" data-accessory="crown" aria-label="Crown, regal" aria-pressed="false">
                            <span class="accessory-icon accessory-icon-crown" aria-hidden="true"></span>
                            <span class="builder-choice-copy"><strong>Crown</strong><small>regal</small></span>
                        </button>
                        <button type="button" class="builder-choice" data-accessory="star" aria-label="Star, cosmic" aria-pressed="false">
                            <span class="accessory-icon accessory-icon-star" aria-hidden="true"></span>
                            <span class="builder-choice-copy"><strong>Star</strong><small>cosmic</small></span>
                        </button>
                    </div>
                </fieldset>

                <div class="builder-actions">
                    <button class="builder-save" id="save-pet" type="submit">Bring pet along <span aria-hidden="true">&rarr;</span></button>
                    <button class="builder-randomize" id="randomize-pet" type="button">Surprise me</button>
                    <button class="builder-reset" id="release-pet" type="button" hidden>Release pet</button>
                </div>
                <p class="builder-status" id="builder-status" role="status" aria-live="polite">Design a friend, then send them exploring.</p>
            </form>
        </section>
    </main>

    <script src="../site-play.js?v=pet-companion-2"></script>
    <script src="app.js?v=2"></script>
</body>
</html>
